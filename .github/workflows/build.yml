name: Build Multi-Platform

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -v ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: ubuntu-latest
            target: windows_x64
            installers: "false"
          - name: linux-x64
            os: ubuntu-latest
            target: linux_x64
            installers: "false"
          - name: android-arm64
            os: ubuntu-latest
            target: android_arm64
            installers: "false"
          - name: macos-arm64
            os: macos-latest
            target: macos_arm64
            installers: "true"

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build target (${{ matrix.target }})
        run: go tool nsgo build -target ${{ matrix.target }} -installers=${{ matrix.installers }}

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          case "${{ matrix.target }}" in
            windows_x64)
              cd dist
              zip -r -q ../artifacts/ZyNSGo-windows-x64.zip ZyNSGo-*-windows_x64
              ;;
            linux_x64)
              cd dist
              tar -czf ../artifacts/ZyNSGo-linux-x64.tar.gz ZyNSGo-*-linux_x64
              ;;
            android_arm64)
              cp dist/ZyNSGo-*-android_arm64/ZyNSGo.apk artifacts/ZyNSGo-android-arm64.apk
              ;;
            macos_arm64)
              shopt -s nullglob
              for dmg in dist/*.dmg dist/releases/*.dmg; do
                cp "$dmg" artifacts/
              done
              for app in dist/ZyNSGo-*-macos_arm64/ZyNSGo.app; do
                ditto -c -k --sequesterRsrc --keepParent "$app" artifacts/ZyNSGo-macos-arm64.zip
              done
              ;;
          esac
          ls -lh artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZyNSGo-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
